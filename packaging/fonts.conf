<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- System fonts are always present on Windows -->
  <dir>C:\Windows\Fonts</dir>
  <!-- Writable per-user cache (the bundle itself is read-only) -->
  <cachedir prefix="xdg">fontconfig</cachedir>
  <config>
    <blank>
      <string> </string>
    </blank>
  </config>
</fontconfig>
