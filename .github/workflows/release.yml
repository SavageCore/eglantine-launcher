name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_ID: dev.savagecore.EglantineLauncher

jobs:
  create-release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release-id: ${{ steps.create.outputs.id }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install git-cliff
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tmp=$(mktemp -d)
          gh release download --repo orhun/git-cliff \
            --pattern 'git-cliff-*-x86_64-unknown-linux-musl.tar.gz' \
            --dir "$tmp"
          tar xz -C "$tmp" -f "$tmp"/git-cliff-*-x86_64-unknown-linux-musl.tar.gz
          sudo install -m 755 "$(find "$tmp" -name git-cliff -type f)" /usr/local/bin/git-cliff
      - name: Generate release notes
        id: cliff
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          {
            echo "content<<EOF"
            git cliff --latest --strip all
            echo ""
            echo "## Downloads"
            echo ""
            echo "| Platform | Download |"
            echo "|----------|----------|"
            echo "| Windows | [Portable .zip](${BASE}/eglantine-launcher-windows.zip) |"
            echo "| Linux - portable | [Portable .zip](${BASE}/eglantine-launcher-linux.zip) |"
            echo "| Linux - Debian/Ubuntu | [.deb package](${BASE}/eglantine-launcher_${VERSION}-1_amd64.deb) |"
            echo "| Linux - Fedora/Nobara | [.rpm package](${BASE}/eglantine-launcher-${VERSION}-1.x86_64.rpm) |"
            echo "| Linux - Flatpak | [Flatpak bundle](${BASE}/eglantine-launcher.flatpak) |"
            echo ""
            echo "> **Not sure which to pick?** Windows: unzip and run \`eglantine-launcher.exe\`. Linux: use your distro's native package (.deb/.rpm), the portable .zip for anything else, or Flatpak for a sandboxed install. Package repos (apt/dnf/flatpak remote) are at https://savagecore.github.io/eglantine-launcher/."
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Create GitHub Release
        id: create
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Eglantine Launcher ${{ github.ref_name }}
          body: ${{ steps.cliff.outputs.content }}

  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: eglantine-launcher-linux
          - os: windows-latest
            artifact: eglantine-launcher-windows
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: ${{ matrix.os == 'windows-latest' && 'msys2 {0}' || 'bash' }}
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python (Linux)
        if: matrix.os != 'windows-latest'
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Set up MSYS2 (Windows)
        if: matrix.os == 'windows-latest'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-python-pip
            mingw-w64-ucrt-x86_64-python-gobject
            mingw-w64-ucrt-x86_64-gtk4
            mingw-w64-ucrt-x86_64-libadwaita
            mingw-w64-ucrt-x86_64-gdk-pixbuf2
            mingw-w64-ucrt-x86_64-librsvg
            mingw-w64-ucrt-x86_64-fontconfig
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update
            sudo apt-get install -y python3-gi gir1.2-gtk-4.0 gir1.2-adw-1
          fi
      - name: Build with PyInstaller
        run: pyinstaller --noconfirm eglantine-launcher.spec
      - name: Smoke test (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          ./dist/eglantine-launcher/eglantine-launcher.exe --check
          test -f dist/eglantine-launcher/_internal/libgtk-4-1.dll
          test -f dist/eglantine-launcher/_internal/libadwaita-1-0.dll
          test -f dist/eglantine-launcher/eglantine-launcher.exe
          ls dist/eglantine-launcher/_internal/lib/girepository-1.0/Gtk-4.0.typelib
          ls dist/eglantine-launcher/_internal/share/glib-2.0/schemas/gschemas.compiled
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist/eglantine-launcher/

  pkgs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Stage files
        run: |
          set -e
          rm -rf stage
          mkdir -p stage/usr/lib/eglantine-launcher stage/usr/bin \
            stage/usr/share/applications stage/usr/share/icons/hicolor/scalable/apps \
            stage/usr/share/metainfo
          cp -r eglantine_launcher stage/usr/lib/eglantine-launcher/
          find stage -name __pycache__ -type d -prune -exec rm -rf {} +
          install -m755 packaging/eglantine-launcher.sh stage/usr/bin/eglantine-launcher
          install -m644 packaging/dev.savagecore.EglantineLauncher.desktop stage/usr/share/applications/
          install -m644 data/icons/eglantine-launcher.svg \
            stage/usr/share/icons/hicolor/scalable/apps/eglantine-launcher.svg
          install -m644 data/dev.savagecore.EglantineLauncher.metainfo.xml stage/usr/share/metainfo/
      - name: Install nfpm
        run: |
          curl -fsSL -o /tmp/nfpm.tar.gz \
            https://github.com/goreleaser/nfpm/releases/download/v2.48.0/nfpm_2.48.0_Linux_x86_64.tar.gz
          tar -xzf /tmp/nfpm.tar.gz nfpm
          sudo install -m755 nfpm /usr/local/bin/nfpm
      - name: Build rpm and deb
        run: |
          # strip a leading v from tags (v0.1.0 -> 0.1.0)
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i "s/^version: .*/version: \"${VERSION:-0.0.0}\"/" packaging/nfpm.yaml
          grep '^version:' packaging/nfpm.yaml
          nfpm package --config packaging/nfpm.yaml --packager deb --target .
          nfpm package --config packaging/nfpm.yaml --packager rpm --target .
          ls -la ./*.deb ./*.rpm
      - name: Sign RPM
        env:
          RPM_SIGNING_KEY: ${{ secrets.RPM_SIGNING_KEY }}
        run: |
          set -e
          if [ -z "${RPM_SIGNING_KEY:-}" ]; then
            if [[ "${GITHUB_REF:-}" == refs/tags/* ]]; then
              echo "ERROR: RPM_SIGNING_KEY is empty - refusing to publish unsigned RPM for tag ${GITHUB_REF_NAME}."
              exit 1
            fi
            echo "RPM_SIGNING_KEY is empty - leaving RPM unsigned (forks / local runs)."
            exit 0
          fi
          sudo apt-get update
          sudo apt-get install -y rpm gnupg
          printf '%s' "$RPM_SIGNING_KEY" | gpg --batch --import
          gpg --batch --list-secret-keys "Eglantine Launcher"
          cat > ~/.rpmmacros <<'EOF'
          %_gpg_name Eglantine Launcher <eglantine-launcher@savagecore.github.io>
          %__gpg_sign_cmd %{__gpg} gpg --batch --no-verbose --no-armor --pinentry-mode loopback --passphrase '' --no-secmem-warning -u "%{_gpg_name}" -sbo %{__signature_filename} %{__plaintext_filename}
          EOF
          rpm --addsign ./*.rpm
          echo "Verifying signatures:"
          sudo rpm --import packaging/RPM-GPG-KEY-eglantine-launcher
          if ! sudo rpm -K ./*.rpm; then
            echo "--- verbose verification ---"
            sudo rpm -Kv ./*.rpm || true
            exit 1
          fi
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: eglantine-launcher-pkgs
          path: |
            eglantine-launcher*.deb
            eglantine-launcher*.rpm

  flatpak:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install flatpak tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          sudo flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install -y flathub org.gnome.Platform//48 org.gnome.Sdk//48
      - name: Build
        run: |
          flatpak-builder --force-clean --repo=repo build-dir \
            flatpak/${{ env.APP_ID }}.json
          flatpak build-bundle repo eglantine-launcher.flatpak ${{ env.APP_ID }}
          ls -la eglantine-launcher.flatpak
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: eglantine-launcher-flatpak
          path: eglantine-launcher.flatpak

  release:
    needs: [create-release, build, pkgs, flatpak]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Zip portable builds
        run: |
          cd artifacts
          zip -r eglantine-launcher-linux.zip eglantine-launcher-linux
          zip -r eglantine-launcher-windows.zip eglantine-launcher-windows
      - name: Upload release assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            artifacts/eglantine-launcher-linux.zip
            artifacts/eglantine-launcher-windows.zip
            artifacts/eglantine-launcher-pkgs/*
            artifacts/eglantine-launcher-flatpak/eglantine-launcher.flatpak

  repos:
    needs: [pkgs, flatpak]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: eglantine-launcher-pkgs
          path: artifacts/pkgs
      - uses: actions/download-artifact@v8
        with:
          name: eglantine-launcher-flatpak
          path: artifacts/flatpak-bundle
      - name: Build apt/dnf/flatpak repos
        env:
          RPM_SIGNING_KEY: ${{ secrets.RPM_SIGNING_KEY }}
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y dpkg-dev createrepo-c flatpak ostree gnupg rpm
          site=_site
          rm -rf "$site"
          mkdir -p "$site/apt" "$site/dnf"
          cp artifacts/pkgs/*.deb "$site/apt/"
          cp artifacts/pkgs/*.rpm "$site/dnf/"
          (cd "$site/apt" && dpkg-scanpackages --multiversion . /dev/null | gzip -9c > Packages.gz)
          createrepo_c "$site/dnf"
          if [ -z "${RPM_SIGNING_KEY:-}" ]; then
            if [[ "${GITHUB_REF:-}" == refs/tags/* ]]; then
              echo "ERROR: RPM_SIGNING_KEY is empty - refusing to publish unsigned dnf repo for tag ${GITHUB_REF_NAME}."
              exit 1
            fi
            echo "WARNING: RPM_SIGNING_KEY is empty - repodata left unsigned."
          else
            printf '%s' "$RPM_SIGNING_KEY" | gpg --batch --import
            gpg --batch --yes --pinentry-mode loopback --passphrase '' \
              --detach-sign --armor \
              -u "Eglantine Launcher <eglantine-launcher@savagecore.github.io>" \
              "$site/dnf/repodata/repomd.xml"
            test -f "$site/dnf/repodata/repomd.xml.asc"
          fi
          # nobara-updater replays with localpkg_gpgcheck=1: never publish unsigned RPMs
          sudo rpm --import packaging/RPM-GPG-KEY-eglantine-launcher
          sudo rpm -K "$site/dnf/"*.rpm
          cp packaging/RPM-GPG-KEY-eglantine-launcher "$site/dnf/"
          cp packaging/eglantine-launcher.repo "$site/dnf/"
          ls -la "$site/dnf/" "$site/dnf/repodata/"
          ostree --repo="$site/flatpak" init --mode=archive-z2 || true
          flatpak build-import-bundle "$site/flatpak" \
            artifacts/flatpak-bundle/eglantine-launcher.flatpak
          flatpak build-update-repo "$site/flatpak"
          cp flatpak/eglantine-launcher.flatpakref "$site/flatpak/"
          cp packaging/gh-pages-index.html "$site/index.html"
      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          keep_files: false
