[project]
name = "eglantine-launcher"
version = "0.1.0"
description = "Simple launcher for Eglantine (download/build + update check)"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.14",
]

[project.scripts]
eglantine-launcher = "eglantine_launcher.__main__:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = [
    "E402",
    "E501",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
